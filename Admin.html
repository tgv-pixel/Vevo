<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEVOBet - Fast Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; }
        
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .login-box { background: white; padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); text-align: center; }
        .login-box .logo { font-size: 48px; color: #667eea; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .login-box button { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .error-msg { color: #ff4757; margin-top: 10px; font-size: 14px; }

        .admin-container { display: none; min-height: 100vh; }
        .admin-sidebar { width: 280px; background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%); color: white; position: fixed; height: 100vh; overflow-y: auto; }
        .admin-logo { padding: 25px; text-align: center; border-bottom: 2px solid rgba(255,215,0,0.3); }
        .admin-logo i { font-size: 40px; color: #ffd700; }
        .admin-logo h2 { margin-top: 10px; font-size: 20px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; margin: 5px 10px; color: rgba(255,255,255,0.8); border-radius: 10px; cursor: pointer; transition: all 0.3s; }
        .nav-item:hover { background: rgba(255,255,255,0.1); color: white; }
        .nav-item.active { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #1a1a2e; font-weight: bold; }

        .admin-main { margin-left: 280px; padding: 20px; }
        .admin-header { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 15px; padding: 20px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; color: white; }
        .admin-user { display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.3); padding: 8px 20px; border-radius: 50px; }
        .logout-admin { background: #ff4757; color: white; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: white; border-radius: 15px; padding: 15px; text-align: center; }
        .stat-card i { font-size: 32px; color: #667eea; margin-bottom: 8px; }
        .stat-card .number { font-size: 28px; font-weight: bold; color: #333; }

        .section-card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 25px; }
        .section-title { margin-bottom: 15px; color: #333; border-bottom: 2px solid #667eea; padding-bottom: 10px; }

        .filter-tabs { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-tab { padding: 8px 20px; background: #e0e0e0; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; }
        .filter-tab.active { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #1a1a2e; }

        .search-bar { background: #f5f5f5; border-radius: 10px; padding: 10px 15px; margin-bottom: 15px; display: flex; align-items: center; }
        .search-bar i { color: #999; margin-right: 10px; }
        .search-bar input { flex: 1; border: none; background: transparent; outline: none; font-size: 16px; }

        .table-wrapper { max-height: 500px; overflow-y: auto; border-radius: 10px; border: 1px solid #e0e0e0; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: #f5f5f5; padding: 12px; text-align: left; position: sticky; top: 0; font-weight: bold; z-index: 10; }
        td { padding: 10px 12px; border-bottom: 1px solid #e0e0e0; }
        tr:hover { background: #f9f9f9; cursor: pointer; }

        .badge { padding: 4px 10px; border-radius: 15px; font-size: 11px; font-weight: bold; display: inline-block; }
        .badge-pending { background: #ffd700; color: #333; }
        .badge-approved { background: #48bb78; color: white; }
        .badge-rejected { background: #ff4757; color: white; }

        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
        .pagination button { padding: 8px 16px; background: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .pagination button.active { background: #ffd700; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }

        .loading { text-align: center; padding: 40px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e0e0e0; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); overflow-y: auto; }
        .modal-content { background: white; margin: 5% auto; padding: 25px; border-radius: 20px; width: 90%; max-width: 550px; position: relative; }
        .close-modal { position: absolute; right: 20px; top: 15px; font-size: 28px; cursor: pointer; color: #999; }
        .close-modal:hover { color: #333; }
        .modal-header { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #667eea; }
        .detail-row { margin: 12px 0; display: flex; }
        .detail-label { font-weight: bold; color: #666; width: 40%; }
        .detail-value { color: #333; width: 60%; word-break: break-all; }
        .screenshot-img { max-width: 100%; border-radius: 10px; margin-top: 10px; border: 1px solid #ddd; cursor: zoom-in; }
        .action-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .btn-approve { flex: 1; background: #48bb78; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-reject { flex: 1; background: #ff4757; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-reset { background: #ffd700; color: #333; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }

        .notification-badge { background: #ff4757; color: white; border-radius: 50%; padding: 2px 8px; font-size: 12px; margin-left: 8px; }
        
        .menu-toggle { display: none; position: fixed; top: 20px; left: 20px; z-index: 101; background: #ffd700; border: none; padding: 10px; border-radius: 8px; cursor: pointer; }
        
        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .admin-sidebar { transform: translateX(-100%); position: fixed; z-index: 100; transition: transform 0.3s; }
            .admin-sidebar.open { transform: translateX(0); }
            .admin-main { margin-left: 0; padding-top: 60px; }
        }
        
        .notification { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 10px; color: white; z-index: 2000; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .error-box { background: #ffebee; border: 1px solid #ff4757; border-radius: 10px; padding: 20px; text-align: center; color: #ff4757; }
        .retry-btn { background: #667eea; color: white; border: none; padding: 10px 25px; border-radius: 8px; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>

    <!-- Login Page -->
    <div id="loginPage" class="login-container">
        <div class="login-box">
            <div class="logo"><i class="fas fa-dice-d6"></i></div>
            <h2>Admin Login</h2>
            <p>VEVOBet Administration</p>
            <input type="text" id="adminUsername" placeholder="Username" value="abel">
            <input type="password" id="adminPassword" placeholder="Password" value="9679">
            <button onclick="adminLogin()">Login</button>
            <div id="loginError" class="error-msg"></div>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" class="admin-container">
        <div class="admin-sidebar" id="adminSidebar">
            <div class="admin-logo">
                <i class="fas fa-dice-d6"></i>
                <h2>VEVOBet Admin</h2>
                <p style="font-size:12px; opacity:0.7;">Telegram Active</p>
            </div>
            <div class="admin-nav">
                <div class="nav-item active" data-tab="dashboard"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></div>
                <div class="nav-item" data-tab="deposits"><i class="fas fa-money-bill-wave"></i> <span>Deposits</span> <span class="notification-badge" id="pendingDepositBadge">0</span></div>
                <div class="nav-item" data-tab="withdraws"><i class="fas fa-hand-holding-usd"></i> <span>Withdrawals</span> <span class="notification-badge" id="pendingWithdrawBadge">0</span></div>
                <div class="nav-item" data-tab="users"><i class="fas fa-users"></i> <span>All Users</span></div>
                <div class="nav-item" data-tab="settings"><i class="fas fa-cog"></i> <span>Settings</span></div>
            </div>
        </div>

        <div class="admin-main">
            <div class="admin-header">
                <h1><i class="fas fa-chart-line"></i> <span id="pageTitle">Dashboard</span></h1>
                <div class="admin-user">
                    <i class="fas fa-user-shield"></i>
                    <span>Abel</span>
                    <button class="logout-admin" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
            </div>
            <div id="adminContent">
                <div class="loading"><div class="spinner"></div><p style="margin-top:15px;color:white;">Loading...</p></div>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeDetailModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyCAfsKcVP7OUo870TKkBnk4BfDEq9LnAK8",
            authDomain: "newporoject-c6f66.firebaseapp.com",
            databaseURL: "https://newporoject-c6f66-default-rtdb.firebaseio.com",
            projectId: "newporoject-c6f66",
            storageBucket: "newporoject-c6f66.appspot.com",
            messagingSenderId: "733557611631",
            appId: "1:733557611631:web:02c9377f56d614ff3b019a"
        };
        
        // Telegram Bot Configuration
        const TELEGRAM_BOT_TOKEN = '8210146562:AAHvM54C4KvHsf-YfAjOC9VLe6o1l-gEtBM';
        const TELEGRAM_CHAT_ID = '7420938284';
        
        const ADMIN_USERNAME = "abel";
        const ADMIN_PASSWORD = "9679";
        const PAGE_SIZE = 25;
        
        let isLoggedIn = false;
        let currentTab = 'dashboard';
        let currentFilter = 'pending';
        let pendingDepositCount = 0;
        let pendingWithdrawCount = 0;
        let realtimeListeners = [];
        
        // Cached data
        let cachedDeposits = [];
        let cachedWithdraws = [];
        let cachedUsers = [];
        
        // ============================================
        // TELEGRAM NOTIFICATION FUNCTION
        // ============================================
        async function sendTelegramNotification(message) {
            try {
                const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
                const data = await response.json();
                if (!data.ok) console.error('Telegram error:', data.description);
                return data.ok;
            } catch (error) {
                console.error('Failed to send Telegram notification:', error);
                return false;
            }
        }
        
        // ============================================
        // REAL-TIME LISTENERS (Simplified - no query filters)
        // ============================================
        function setupRealtimeListeners() {
            realtimeListeners.forEach(unsub => unsub());
            realtimeListeners = [];
            
            // Listen for all new deposits (we filter client-side)
            const depositsRef = firebase.database().ref('deposits');
            depositsRef.on('child_added', (snapshot) => {
                const deposit = snapshot.val();
                deposit.id = snapshot.key;
                
                // Add to cache
                cachedDeposits.push(deposit);
                
                // Notify if pending and recent
                if (deposit.status === 'pending' && deposit.createdAt && Date.now() - deposit.createdAt < 10000) {
                    const message = `💰 <b>NEW DEPOSIT REQUEST</b>\n\n` +
                        `👤 <b>User:</b> ${deposit.userName || 'N/A'}\n` +
                        `📧 <b>Email:</b> ${deposit.userEmail}\n` +
                        `💵 <b>Amount:</b> ${deposit.amount} ${deposit.currency || 'BIRR'}\n` +
                        `🪙 <b>VEVO Value:</b> ${deposit.vevoAmount} VEVO\n` +
                        `🏦 <b>Method:</b> ${deposit.methodDetails || deposit.method || 'N/A'}\n` +
                        `⏰ <b>Time:</b> ${new Date(deposit.createdAt).toLocaleString()}`;
                    
                    sendTelegramNotification(message);
                    showNotification('New deposit request!', 'info');
                    updatePendingCounts();
                }
            });
            
            depositsRef.on('child_changed', (snapshot) => {
                const deposit = snapshot.val();
                deposit.id = snapshot.key;
                const index = cachedDeposits.findIndex(d => d.id === deposit.id);
                if (index !== -1) cachedDeposits[index] = deposit;
                else cachedDeposits.push(deposit);
                updatePendingCounts();
            });
            
            // Listen for all new withdrawals
            const withdrawsRef = firebase.database().ref('withdraws');
            withdrawsRef.on('child_added', (snapshot) => {
                const withdraw = snapshot.val();
                withdraw.id = snapshot.key;
                
                cachedWithdraws.push(withdraw);
                
                if (withdraw.status === 'pending' && withdraw.createdAt && Date.now() - withdraw.createdAt < 10000) {
                    const message = `💸 <b>NEW WITHDRAWAL REQUEST</b>\n\n` +
                        `👤 <b>User:</b> ${withdraw.userName || 'N/A'}\n` +
                        `📧 <b>Email:</b> ${withdraw.userEmail}\n` +
                        `💰 <b>Amount:</b> ${withdraw.amount} VEVO\n` +
                        `📱 <b>Method:</b> ${withdraw.methodName || withdraw.method}\n` +
                        `🔢 <b>Account:</b> ${withdraw.account}\n` +
                        `⏰ <b>Time:</b> ${new Date(withdraw.createdAt).toLocaleString()}`;
                    
                    sendTelegramNotification(message);
                    showNotification('New withdrawal request!', 'info');
                    updatePendingCounts();
                }
            });
            
            withdrawsRef.on('child_changed', (snapshot) => {
                const withdraw = snapshot.val();
                withdraw.id = snapshot.key;
                const index = cachedWithdraws.findIndex(w => w.id === withdraw.id);
                if (index !== -1) cachedWithdraws[index] = withdraw;
                else cachedWithdraws.push(withdraw);
                updatePendingCounts();
            });
            
            realtimeListeners = [() => depositsRef.off(), () => withdrawsRef.off()];
        }
        
        // Update pending counts
        function updatePendingCounts() {
            pendingDepositCount = cachedDeposits.filter(d => d.status === 'pending').length;
            pendingWithdrawCount = cachedWithdraws.filter(w => w.status === 'pending').length;
            
            const depositBadge = document.getElementById('pendingDepositBadge');
            const withdrawBadge = document.getElementById('pendingWithdrawBadge');
            if (depositBadge) depositBadge.textContent = pendingDepositCount;
            if (withdrawBadge) withdrawBadge.textContent = pendingWithdrawCount;
        }
        
        // ============================================
        // HELPER FUNCTIONS
        // ============================================
        function toggleSidebar() { document.getElementById('adminSidebar').classList.toggle('open'); }
        
        function showNotification(msg, type = 'info') {
            const n = document.createElement('div');
            n.className = 'notification';
            n.style.background = type === 'success' ? '#48bb78' : type === 'error' ? '#ff4757' : '#667eea';
            n.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i> ${msg}`;
            document.body.appendChild(n);
            setTimeout(() => n.remove(), 3000);
        }
        
        function adminLogin() {
            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;
            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                isLoggedIn = true;
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                loadInitialData();
                sendTelegramNotification('🔐 <b>Admin Logged In</b>\nAbel has accessed the admin panel.');
            } else {
                document.getElementById('loginError').textContent = 'Invalid credentials';
            }
        }
        
        async function loadInitialData() {
            try {
                // Load all data once and cache it
                const [depositsSnap, withdrawsSnap, usersSnap] = await Promise.all([
                    firebase.database().ref('deposits').once('value'),
                    firebase.database().ref('withdraws').once('value'),
                    firebase.database().ref('users').once('value')
                ]);
                
                // Cache deposits
                cachedDeposits = [];
                depositsSnap.forEach(child => {
                    cachedDeposits.push({ id: child.key, ...child.val() });
                });
                
                // Cache withdrawals
                cachedWithdraws = [];
                withdrawsSnap.forEach(child => {
                    cachedWithdraws.push({ id: child.key, ...child.val() });
                });
                
                // Cache users
                cachedUsers = [];
                usersSnap.forEach(child => {
                    cachedUsers.push({ uid: child.key, ...child.val() });
                });
                
                setupRealtimeListeners();
                updatePendingCounts();
                loadDashboard();
                
            } catch (error) {
                console.error('Error loading initial data:', error);
                showNotification('Error loading data. Check console.', 'error');
                document.getElementById('adminContent').innerHTML = `
                    <div class="error-box">
                        <i class="fas fa-exclamation-triangle" style="font-size: 48px;"></i>
                        <h3>Failed to load data</h3>
                        <p>${error.message}</p>
                        <button class="retry-btn" onclick="loadInitialData()">Retry</button>
                    </div>
                `;
            }
        }
        
        function adminLogout() {
            realtimeListeners.forEach(unsub => unsub());
            realtimeListeners = [];
            isLoggedIn = false;
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('adminDashboard').style.display = 'none';
        }
        
        // ============================================
        // LOAD DASHBOARD
        // ============================================
        function loadDashboard() {
            document.getElementById('pageTitle').textContent = 'Dashboard';
            
            const pendingDeposits = cachedDeposits.filter(d => d.status === 'pending').length;
            const approvedDeposits = cachedDeposits.filter(d => d.status === 'approved').reduce((s, d) => s + (d.vevoAmount || 0), 0);
            const pendingWithdraws = cachedWithdraws.filter(w => w.status === 'pending').length;
            const approvedWithdraws = cachedWithdraws.filter(w => w.status === 'approved').reduce((s, w) => s + (w.amount || 0), 0);
            
            const totalBalance = cachedUsers.reduce((s, u) => s + (u.balance || 0), 0);
            
            const html = `
                <div class="stats-grid">
                    <div class="stat-card"><i class="fas fa-users"></i><h3>Total Users</h3><div class="number">${cachedUsers.length}</div></div>
                    <div class="stat-card"><i class="fas fa-clock"></i><h3>Pending Deposits</h3><div class="number" style="color:#ff8c00;">${pendingDeposits}</div></div>
                    <div class="stat-card"><i class="fas fa-clock"></i><h3>Pending Withdrawals</h3><div class="number" style="color:#ff8c00;">${pendingWithdraws}</div></div>
                    <div class="stat-card"><i class="fas fa-check-circle"></i><h3>Total Deposits</h3><div class="number">${approvedDeposits.toLocaleString()} VEVO</div></div>
                    <div class="stat-card"><i class="fas fa-hand-holding-usd"></i><h3>Total Withdrawals</h3><div class="number">${approvedWithdraws.toLocaleString()} VEVO</div></div>
                    <div class="stat-card"><i class="fas fa-coins"></i><h3>Circulation</h3><div class="number">${totalBalance.toLocaleString()} VEVO</div></div>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="section-card">
                        <h3 class="section-title"><i class="fab fa-telegram"></i> Telegram Bot</h3>
                        <div style="padding: 15px; background: #e8f5e9; border-radius: 10px;">
                            <p><i class="fas fa-check-circle" style="color:#48bb78;"></i> <strong>Bot Connected</strong></p>
                            <p style="margin-top: 10px; font-size: 14px;">Chat ID: ${TELEGRAM_CHAT_ID}</p>
                            <button onclick="testTelegramNow()" style="margin-top: 15px; padding: 8px 20px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer;">
                                <i class="fab fa-telegram"></i> Send Test
                            </button>
                        </div>
                    </div>
                    <div class="section-card">
                        <h3 class="section-title"><i class="fas fa-bell"></i> Quick Actions</h3>
                        <div style="display: flex; flex-direction: column; gap: 10px;">
                            <button onclick="loadDeposits('pending')" style="padding: 15px; background: #fff3e0; border: none; border-radius: 10px; cursor: pointer; text-align: left;">
                                <i class="fas fa-money-bill-wave" style="color:#ff8c00;"></i> 
                                <strong>Pending Deposits (${pendingDeposits})</strong>
                            </button>
                            <button onclick="loadWithdraws('pending')" style="padding: 15px; background: #e3f2fd; border: none; border-radius: 10px; cursor: pointer; text-align: left;">
                                <i class="fas fa-hand-holding-usd" style="color:#2196f3;"></i> 
                                <strong>Pending Withdrawals (${pendingWithdraws})</strong>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('adminContent').innerHTML = html;
        }
        
        async function testTelegramNow() {
            const ok = await sendTelegramNotification('🧪 <b>Test Message</b>\n✅ Bot is working correctly!');
            showNotification(ok ? 'Test sent!' : 'Failed', ok ? 'success' : 'error');
        }
        
        // ============================================
        // LOAD DEPOSITS (Client-side filtering from cache)
        // ============================================
        function loadDeposits(filter = 'pending', page = 1) {
            currentFilter = filter;
            document.getElementById('pageTitle').textContent = 'Deposit Requests';
            
            // Filter from cache
            let filteredDeposits = cachedDeposits;
            if (filter !== 'all') {
                filteredDeposits = cachedDeposits.filter(d => d.status === filter);
            }
            
            // Sort by date (newest first)
            filteredDeposits.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            
            const pendingCount = cachedDeposits.filter(d => d.status === 'pending').length;
            const approvedCount = cachedDeposits.filter(d => d.status === 'approved').length;
            const rejectedCount = cachedDeposits.filter(d => d.status === 'rejected').length;

        // ============================================
        // ACTIONS
        // ============================================
        async function approveDeposit(id, vevoAmount, userId, userEmail, amount, currency) {
            if (!confirm(`Approve deposit? User will receive ${vevoAmount} VEVO.`)) return;
            
            await firebase.database().ref(`deposits/${id}`).update({ status: 'approved', approvedAt: Date.now() });
            
            if (userId) {
                const userRef = firebase.database().ref(`users/${userId}`);
                const userSnap = await userRef.once('value');
                const user = userSnap.val();
                await userRef.update({ balance: (user.balance || 0) + vevoAmount });
            }
            
            await sendTelegramNotification(
                `✅ <b>DEPOSIT APPROVED</b>\n\n` +
                `👤 <b>User:</b> ${userEmail}\n` +
                `💰 <b>Amount:</b> ${amount} ${currency}\n` +
                `🪙 <b>Credited:</b> ${vevoAmount} VEVO`
            );
            
            showNotification('Deposit approved!', 'success');
            closeDetailModal();
            
            // Refresh data
            await refreshCache();
            loadDeposits(currentFilter);
        }
        
        async function rejectDeposit(id, userEmail) {
            if (!confirm('Reject this deposit?')) return;
            
            await firebase.database().ref(`deposits/${id}`).update({ status: 'rejected', rejectedAt: Date.now() });
            
            await sendTelegramNotification(
                `❌ <b>DEPOSIT REJECTED</b>\n\n` +
                `👤 <b>User:</b> ${userEmail}`
            );
            
            showNotification('Deposit rejected', 'success');
            closeDetailModal();
            
            await refreshCache();
            loadDeposits(currentFilter);
        }
        
        async function approveWithdraw(id, amount, userId, userEmail) {
            if (!confirm(`Approve withdrawal? ${amount} VEVO will be deducted.`)) return;
            
            await firebase.database().ref(`withdraws/${id}`).update({ status: 'approved', approvedAt: Date.now() });
            
            if (userId) {
                const userRef = firebase.database().ref(`users/${userId}`);
                const userSnap = await userRef.once('value');
                const user = userSnap.val();
                await userRef.update({ balance: (user.balance || 0) - amount });
            }
            
            await sendTelegramNotification(
                `✅ <b>WITHDRAWAL APPROVED</b>\n\n` +
                `👤 <b>User:</b> ${userEmail}\n` +
                `💸 <b>Amount:</b> ${amount} VEVO`
            );
            
            showNotification('Withdrawal approved!', 'success');
            closeDetailModal();
            
            await refreshCache();
            loadWithdraws(currentFilter);
        }
        
        async function rejectWithdraw(id, userEmail) {
            if (!confirm('Reject this withdrawal?')) return;
            
            await firebase.database().ref(`withdraws/${id}`).update({ status: 'rejected', rejectedAt: Date.now() });
            
            await sendTelegramNotification(
                `❌ <b>WITHDRAWAL REJECTED</b>\n\n` +
                `👤 <b>User:</b> ${userEmail}`
            );
            
            showNotification('Withdrawal rejected', 'success');
            closeDetailModal();
            
            await refreshCache();
            loadWithdraws(currentFilter);
        }

            showNotification('Code reset!', 'success');

        async function confirmAddBalance(userId, currentBalance) {
            const amount = parseInt(document.getElementById('addAmount').value);
            if (!amount || amount <= 0) { showNotification('Enter valid amount', 'error'); return; }
            await firebase.database().ref(`users/${userId}`).update({ balance: currentBalance + amount });
            showNotification(`Added ${amount} VEVO!`, 'success');
            closeDetailModal();
            await refreshCache();
        }
        
        async function refreshCache() {
            try {
                const [depositsSnap, withdrawsSnap, usersSnap] = await Promise.all([
                    firebase.database().ref('deposits').once('value'),
                    firebase.database().ref('withdraws').once('value'),
                    firebase.database().ref('users').once('value')
                ]);
                
                cachedDeposits = [];
                depositsSnap.forEach(child => cachedDeposits.push({ id: child.key, ...child.val() }));
                
                cachedWithdraws = [];
                withdrawsSnap.forEach(child => cachedWithdraws.push({ id: child.key, ...child.val() }));
                
                cachedUsers = [];
                usersSnap.forEach(child => cachedUsers.push({ uid: child.key, ...child.val() }));
                
                updatePendingCounts();
            } catch (e) {
                console.error('Error refreshing cache:', e);
            }
        }

                row.style.display = text.includes(search) ? '' : 'none';
            });
        }
