<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEVOBet - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; }
        
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .login-box { background: white; padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); text-align: center; }
        .login-box .logo { font-size: 48px; color: #667eea; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .login-box button { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .error-msg { color: #ff4757; margin-top: 10px; }

        .admin-container { display: none; min-height: 100vh; }
        .admin-sidebar { width: 280px; background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%); color: white; position: fixed; height: 100vh; overflow-y: auto; }
        .admin-logo { padding: 25px; text-align: center; border-bottom: 2px solid rgba(255,215,0,0.3); }
        .admin-logo i { font-size: 40px; color: #ffd700; }
        .admin-logo h2 { margin-top: 10px; font-size: 20px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; margin: 5px 10px; color: rgba(255,255,255,0.8); border-radius: 10px; cursor: pointer; }
        .nav-item:hover { background: rgba(255,255,255,0.1); }
        .nav-item.active { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #1a1a2e; font-weight: bold; }
        .notification-badge { background: #ff4757; color: white; border-radius: 50%; padding: 2px 8px; font-size: 12px; margin-left: 8px; }

        .admin-main { margin-left: 280px; padding: 20px; }
        .admin-header { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 15px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .logout-admin { background: #ff4757; color: white; border: none; padding: 8px 20px; border-radius: 8px; cursor: pointer; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; border-radius: 15px; padding: 15px; text-align: center; }
        .stat-card i { font-size: 28px; color: #667eea; }
        .stat-card .number { font-size: 24px; font-weight: bold; color: #333; }

        .section-card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .section-title { margin-bottom: 15px; color: #333; border-bottom: 2px solid #667eea; padding-bottom: 10px; }

        .filter-tabs { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-tab { padding: 8px 20px; background: #e0e0e0; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; }
        .filter-tab.active { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #1a1a2e; }

        .search-bar { background: #f5f5f5; border-radius: 10px; padding: 10px 15px; margin-bottom: 15px; display: flex; align-items: center; }
        .search-bar input { flex: 1; border: none; background: transparent; outline: none; font-size: 16px; }

        .table-wrapper { max-height: 500px; overflow-y: auto; border-radius: 10px; border: 1px solid #e0e0e0; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: #f5f5f5; padding: 12px; text-align: left; position: sticky; top: 0; font-weight: bold; }
        td { padding: 10px 12px; border-bottom: 1px solid #e0e0e0; }
        tr:hover { background: #f9f9f9; cursor: pointer; }

        .badge { padding: 4px 10px; border-radius: 15px; font-size: 11px; font-weight: bold; }
        .badge-pending { background: #ffd700; color: #333; }
        .badge-approved { background: #48bb78; color: white; }
        .badge-rejected { background: #ff4757; color: white; }

        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
        .pagination button { padding: 8px 16px; background: white; border: none; border-radius: 8px; cursor: pointer; }
        .pagination button.active { background: #ffd700; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }

        .loading { text-align: center; padding: 40px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e0e0e0; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); overflow-y: auto; }
        .modal-content { background: white; margin: 3% auto; padding: 25px; border-radius: 20px; width: 90%; max-width: 550px; position: relative; }
        .close-modal { position: absolute; right: 20px; top: 15px; font-size: 28px; cursor: pointer; color: #999; }
        .modal-header { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #667eea; }
        .detail-row { margin: 12px 0; display: flex; }
        .detail-label { font-weight: bold; color: #666; width: 40%; }
        .detail-value { color: #333; width: 60%; word-break: break-all; }
        .screenshot-img { max-width: 100%; border-radius: 10px; margin-top: 10px; cursor: zoom-in; }
        .action-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .btn-approve { flex: 1; background: #48bb78; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-reject { flex: 1; background: #ff4757; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-warning { background: #ffc107; color: #333; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }

        .menu-toggle { display: none; position: fixed; top: 20px; left: 20px; z-index: 101; background: #ffd700; border: none; padding: 10px; border-radius: 8px; cursor: pointer; }
        
        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .admin-sidebar { transform: translateX(-100%); position: fixed; z-index: 100; transition: transform 0.3s; }
            .admin-sidebar.open { transform: translateX(0); }
            .admin-main { margin-left: 0; padding-top: 60px; }
        }
        
        .notification { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 10px; color: white; z-index: 2000; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>
    <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>

    <!-- Login Page -->
    <div id="loginPage" class="login-container">
        <div class="login-box">
            <div class="logo"><i class="fas fa-dice-d6"></i></div>
            <h2>Admin Login</h2>
            <p>VEVOBet Administration</p>
            <input type="text" id="adminUsername" placeholder="Username" value="abel">
            <input type="password" id="adminPassword" placeholder="Password" value="9679">
            <button onclick="adminLogin()">Login</button>
            <div id="loginError" class="error-msg"></div>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" class="admin-container">
        <div class="admin-sidebar" id="adminSidebar">
            <div class="admin-logo">
                <i class="fas fa-dice-d6"></i>
                <h2>VEVOBet Admin</h2>
                <p style="font-size:12px; opacity:0.7;">Full Control Panel</p>
            </div>
            <div class="admin-nav">
                <div class="nav-item active" data-tab="dashboard"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></div>
                <div class="nav-item" data-tab="deposits"><i class="fas fa-money-bill-wave"></i> <span>Deposits</span> <span class="notification-badge" id="pendingDepositBadge">0</span></div>
                <div class="nav-item" data-tab="withdraws"><i class="fas fa-hand-holding-usd"></i> <span>Withdrawals</span> <span class="notification-badge" id="pendingWithdrawBadge">0</span></div>
                <div class="nav-item" data-tab="users"><i class="fas fa-users"></i> <span>All Users</span></div>
                <div class="nav-item" data-tab="settings"><i class="fas fa-cog"></i> <span>Settings</span></div>
            </div>
        </div>

        <div class="admin-main">
            <div class="admin-header">
                <h1><i class="fas fa-chart-line"></i> <span id="pageTitle">Dashboard</span></h1>
                <div class="admin-user">
                    <i class="fas fa-user-shield"></i>
                    <span>Abel</span>
                    <button class="logout-admin" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
            </div>
            <div id="adminContent">
                <div class="loading"><div class="spinner"></div><p style="margin-top:15px;color:white;">Loading...</p></div>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeDetailModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        // ============================================
        // FIREBASE INITIALIZATION (Fixed)
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyCAfsKcVP7OUo870TKkBnk4BfDEq9LnAK8",
            authDomain: "newporoject-c6f66.firebaseapp.com",
            databaseURL: "https://newporoject-c6f66-default-rtdb.firebaseio.com",
            projectId: "newporoject-c6f66",
            storageBucket: "newporoject-c6f66.appspot.com",
            messagingSenderId: "733557611631",
            appId: "1:733557611631:web:02c9377f56d614ff3b019a"
        };
        
        // Check if Firebase is already initialized
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        
        const ADMIN_USERNAME = "abel";
        const ADMIN_PASSWORD = "9679";
        const PAGE_SIZE = 20;
        
        let isLoggedIn = false;
        let currentFilter = 'pending';
        let cachedDeposits = [];
        let cachedWithdraws = [];
        let cachedUsers = [];
        
        // ============================================
        // HELPER FUNCTIONS
        // ============================================
        function toggleSidebar() { document.getElementById('adminSidebar').classList.toggle('open'); }
        
        function showNotification(msg, type = 'info') {
            const n = document.createElement('div');
            n.className = 'notification';
            n.style.background = type === 'success' ? '#48bb78' : type === 'error' ? '#ff4757' : '#667eea';
            n.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i> ${msg}`;
            document.body.appendChild(n);
            setTimeout(() => n.remove(), 3000);
        }
        
        function adminLogin() {
            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;
            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                isLoggedIn = true;
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                loadInitialData();
            } else {
                document.getElementById('loginError').textContent = 'Invalid credentials';
            }
        }
        
        function adminLogout() {
            isLoggedIn = false;
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('adminDashboard').style.display = 'none';
        }
        
        async function loadInitialData() {
            try {
                document.getElementById('adminContent').innerHTML = '<div class="loading"><div class="spinner"></div><p style="color:white;">Loading data...</p></div>';
                
                const [depositsSnap, withdrawsSnap, usersSnap] = await Promise.all([
                    db.ref('deposits').once('value'),
                    db.ref('withdraws').once('value'),
                    db.ref('users').once('value')
                ]);
                
                // Cache deposits
                cachedDeposits = [];
                depositsSnap.forEach(child => cachedDeposits.push({ id: child.key, ...child.val() }));
                
                // Cache withdrawals
                cachedWithdraws = [];
                withdrawsSnap.forEach(child => cachedWithdraws.push({ id: child.key, ...child.val() }));
                
                // Cache users
                cachedUsers = [];
                usersSnap.forEach(child => cachedUsers.push({ uid: child.key, ...child.val() }));
                
                updatePendingBadges();
                loadDashboard();
                
                // Setup real-time listeners
                setupRealtimeListeners();
                
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('adminContent').innerHTML = `
                    <div class="section-card" style="text-align:center; color:red;">
                        <i class="fas fa-exclamation-triangle" style="font-size:48px;"></i>
                        <h3>Error Loading Data</h3>
                        <p>${error.message}</p>
                        <button onclick="loadInitialData()" style="margin-top:20px; padding:10px 30px; background:#667eea; color:white; border:none; border-radius:8px; cursor:pointer;">Retry</button>
                    </div>
                `;
            }
        }
        
        function setupRealtimeListeners() {
            // Listen for new deposits
            db.ref('deposits').on('child_added', (snap) => {
                const deposit = { id: snap.key, ...snap.val() };
                const exists = cachedDeposits.find(d => d.id === deposit.id);
                if (!exists) {
                    cachedDeposits.push(deposit);
                    updatePendingBadges();
                }
            });
            
            db.ref('deposits').on('child_changed', (snap) => {
                const deposit = { id: snap.key, ...snap.val() };
                const index = cachedDeposits.findIndex(d => d.id === deposit.id);
                if (index !== -1) cachedDeposits[index] = deposit;
                updatePendingBadges();
            });
            
            // Listen for new withdrawals
            db.ref('withdraws').on('child_added', (snap) => {
                const withdraw = { id: snap.key, ...snap.val() };
                const exists = cachedWithdraws.find(w => w.id === withdraw.id);
                if (!exists) {
                    cachedWithdraws.push(withdraw);
                    updatePendingBadges();
                }
            });
            
            db.ref('withdraws').on('child_changed', (snap) => {
                const withdraw = { id: snap.key, ...snap.val() };
                const index = cachedWithdraws.findIndex(w => w.id === withdraw.id);
                if (index !== -1) cachedWithdraws[index] = withdraw;
                updatePendingBadges();
            });
        }
        
        function updatePendingBadges() {
            const pendingDeposits = cachedDeposits.filter(d => d.status === 'pending').length;
            const pendingWithdraws = cachedWithdraws.filter(w => w.status === 'pending').length;
            document.getElementById('pendingDepositBadge').textContent = pendingDeposits;
            document.getElementById('pendingWithdrawBadge').textContent = pendingWithdraws;
        }
        
        // ============================================
        // DASHBOARD
        // ============================================
        function loadDashboard() {
            document.getElementById('pageTitle').textContent = 'Dashboard';
            
            const pendingDeposits = cachedDeposits.filter(d => d.status === 'pending').length;
            const approvedDeposits = cachedDeposits.filter(d => d.status === 'approved').reduce((s, d) => s + (d.vevoAmount || 0), 0);
            const pendingWithdraws = cachedWithdraws.filter(w => w.status === 'pending').length;
            const approvedWithdraws = cachedWithdraws.filter(w => w.status === 'approved').reduce((s, w) => s + (w.amount || 0), 0);
            const totalBalance = cachedUsers.reduce((s, u) => s + (u.balance || 0), 0);
            
            const html = `
                <div class="stats-grid">
                    <div class="stat-card"><i class="fas fa-users"></i><h3>Total Users</h3><div class="number">${cachedUsers.length}</div></div>
                    <div class="stat-card"><i class="fas fa-clock"></i><h3>Pending Deposits</h3><div class="number" style="color:#ff8c00;">${pendingDeposits}</div></div>
                    <div class="stat-card"><i class="fas fa-clock"></i><h3>Pending Withdrawals</h3><div class="number" style="color:#ff8c00;">${pendingWithdraws}</div></div>
                    <div class="stat-card"><i class="fas fa-check-circle"></i><h3>Total Deposits</h3><div class="number">${approvedDeposits.toLocaleString()} VEVO</div></div>
                    <div class="stat-card"><i class="fas fa-hand-holding-usd"></i><h3>Total Withdrawals</h3><div class="number">${approvedWithdraws.toLocaleString()} VEVO</div></div>
                    <div class="stat-card"><i class="fas fa-coins"></i><h3>Circulation</h3><div class="number">${totalBalance.toLocaleString()} VEVO</div></div>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="section-card">
                        <h3 class="section-title"><i class="fas fa-exclamation-circle"></i> Pending Actions</h3>
                        <div style="display: flex; flex-direction: column; gap: 10px;">
                            <button onclick="loadDeposits('pending')" style="padding: 15px; background: #fff3e0; border: none; border-radius: 10px; cursor: pointer;">
                                <i class="fas fa-money-bill-wave" style="color:#ff8c00;"></i> 
                                <strong>Pending Deposits (${pendingDeposits})</strong>
                            </button>
                            <button onclick="loadWithdraws('pending')" style="padding: 15px; background: #e3f2fd; border: none; border-radius: 10px; cursor: pointer;">
                                <i class="fas fa-hand-holding-usd" style="color:#2196f3;"></i> 
                                <strong>Pending Withdrawals (${pendingWithdraws})</strong>
                            </button>
                        </div>
                    </div>
                    <div class="section-card">
                        <h3 class="section-title"><i class="fas fa-database"></i> System Info</h3>
                        <p><strong>Exchange Rate:</strong> 1 Birr = 1 VEVO | 1 USDT = 157 VEVO</p>
                        <p><strong>Referral:</strong> 10 VEVO per 5 invites</p>
                        <p><strong>Last Updated:</strong> ${new Date().toLocaleString()}</p>
                        <button onclick="loadInitialData()" style="margin-top:15px; padding:8px 20px; background:#667eea; color:white; border:none; border-radius:8px; cursor:pointer;">
                            <i class="fas fa-sync-alt"></i> Refresh Data
                        </button>
                    </div>
                </div>
            `;
            document.getElementById('adminContent').innerHTML = html;
        }
        
        // ============================================
        // DEPOSITS
        // ============================================
        function loadDeposits(filter = 'pending', page = 1) {
            currentFilter = filter;
            document.getElementById('pageTitle').textContent = 'Deposit Requests';
            
            let filtered = cachedDeposits;
            if (filter !== 'all') {
                filtered = cachedDeposits.filter(d => d.status === filter);
            }
            filtered.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            
            const pendingCount = cachedDeposits.filter(d => d.status === 'pending').length;
            const approvedCount = cachedDeposits.filter(d => d.status === 'approved').length;
            const rejectedCount = cachedDeposits.filter(d => d.status === 'rejected').length;
            
            const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
            const start = (page - 1) * PAGE_SIZE;
            const pageItems = filtered.slice(start, start + PAGE_SIZE);
            
            let html = `
                <div class="stats-grid">
                    <div class="stat-card"><i class="fas fa-list"></i><h3>Total</h3><div class="number">${cachedDeposits.length}</div></div>
                    <div class="stat-card"><i class="fas fa-clock"></i><h3>Pending</h3><div class="number" style="color:#ff8c00;">${pendingCount}</div></div>
                    <div class="stat-card"><i class="fas fa-check-circle"></i><h3>Approved</h3><div class="number" style="color:#48bb78;">${approvedCount}</div></div>
                    <div class="stat-card"><i class="fas fa-times-circle"></i><h3>Rejected</h3><div class="number" style="color:#ff4757;">${rejectedCount}</div></div>
                </div>
                
                <div class="section-card">
                    <div class="filter-tabs">
                        <button class="filter-tab ${filter === 'pending' ? 'active' : ''}" onclick="loadDeposits('pending')">⏳ Pending (${pendingCount})</button>
                        <button class="filter-tab ${filter === 'approved' ? 'active' : ''}" onclick="loadDeposits('approved')">✅ Approved (${approvedCount})</button>
                        <button class="filter-tab ${filter === 'rejected' ? 'active' : ''}" onclick="loadDeposits('rejected')">❌ Rejected (${rejectedCount})</button>
                        <button class="filter-tab ${filter === 'all' ? 'active' : ''}" onclick="loadDeposits('all')">📋 All (${cachedDeposits.length})</button>
                    </div>
                    
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" id="depositSearch" placeholder="Search by email or name..." onkeyup="filterTable('depositTable', this.value)">
                    </div>
                    
                    <div class="table-wrapper">
                        <table id="depositTable">
                            <thead>
                                <tr><th>User</th><th>Amount</th><th>VEVO</th><th>Method</th><th>Date</th><th>Status</th></tr>
                            </thead>
                            <tbody>
            `;
            
            if (pageItems.length === 0) {
                html += `<tr><td colspan="6" style="text-align:center; padding:40px;">No ${filter} deposits found</td></tr>`;
            } else {
                pageItems.forEach(d => {
                    const statusClass = d.status === 'pending' ? 'badge-pending' : (d.status === 'approved' ? 'badge-approved' : 'badge-rejected');
                    html += `
                        <tr onclick="showDepositDetail('${d.id}')">
                            <td><strong>${d.userName || 'N/A'}</strong><br><small>${d.userEmail || ''}</small></td>
                            <td>${d.amount || 0} ${d.currency || 'BIRR'}</td>
                            <td><strong>${d.vevoAmount || 0} VEVO</strong></td>
                            <td><small>${(d.methodDetails || d.method || 'N/A').substring(0, 20)}</small></td>
                            <td><small>${d.createdAt ? new Date(d.createdAt).toLocaleDateString() : 'N/A'}</small></td>
                            <td><span class="badge ${statusClass}">${(d.status || 'pending').toUpperCase()}</span></td>
                        </tr>
                    `;
                });
            }
            
            html += `</tbody></table></div>`;
            
            if (totalPages > 1) {
                html += `<div class="pagination">`;
                html += `<button onclick="loadDeposits('${filter}', ${page - 1})" ${page === 1 ? 'disabled' : ''}>←</button>`;
                for (let i = Math.max(1, page - 2); i <= Math.min(totalPages, page + 2); i++) {
                    html += `<button class="${i === page ? 'active' : ''}" onclick="loadDeposits('${filter}', ${i})">${i}</button>`;
                }
                html += `<button onclick="loadDeposits('${filter}', ${page + 1})" ${page === totalPages ? 'disabled' : ''}>→</button>`;
                html += `</div>`;
            }
            
            html += `</div>`;
            document.getElementById('adminContent').innerHTML = html;
        }
        
        // ============================================
        // WITHDRAWALS
        // ============================================
        function loadWithdraws(filter = 'pending', page = 1) {
            currentFilter = filter;
            document.getElementById('pageTitle').textContent = 'Withdrawal Requests';
            
            let filtered = cachedWithdraws;
            if (filter !== 'all') {
                filtered = cachedWithdraws.filter(w => w.status === filter);
            }
            filtered.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            
            const pendingCount = cachedWithdraws.filter(w => w.status === 'pending').length;
            const approvedCount = cachedWithdraws.filter(w => w.status === 'approved').length;
            const rejectedCount = cachedWithdraws.filter(w => w.status === 'rejected').length;
            
            const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
            const start = (page - 1) * PAGE_SIZE;
            const pageItems = filtered.slice(start, start + PAGE_SIZE);
            
            let html = `
                <div class="stats-grid">
                    <div class="stat-card"><i class="fas fa-list"></i><h3>Total</h3><div class="number">${cachedWithdraws.length}</div></div>
                    <div class="stat-card"><i class="fas fa-clock"></i><h3>Pending</h3><div class="number" style="color:#ff8c00;">${pendingCount}</div></div>
                    <div class="stat-card"><i class="fas fa-check-circle"></i><h3>Approved</h3><div class="number" style="color:#48bb78;">${approvedCount}</div></div>
                    <div class="stat-card"><i class="fas fa-times-circle"></i><h3>Rejected</h3><div class="number" style="color:#ff4757;">${rejectedCount}</div></div>
                </div>
                
                <div class="section-card">
                    <div class="filter-tabs">
                        <button class="filter-tab ${filter === 'pending' ? 'active' : ''}" onclick="loadWithdraws('pending')">⏳ Pending (${pendingCount})</button>
                        <button class="filter-tab ${filter === 'approved' ? 'active' : ''}" onclick="loadWithdraws('approved')">✅ Approved (${approvedCount})</button>
                        <button class="filter-tab ${filter === 'rejected' ? 'active' : ''}" onclick="loadWithdraws('rejected')">❌ Rejected (${rejectedCount})</button>
                        <button class="filter-tab ${filter === 'all' ? 'active' : ''}" onclick="loadWithdraws('all')">📋 All (${cachedWithdraws.length})</button>
                    </div>
                    
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" id="withdrawSearch" placeholder="Search by email or name..." onkeyup="filterTable('withdrawTable', this.value)">
                    </div>
                    
                    <div class="table-wrapper">
                        <table id="withdrawTable">
                            <thead>
                                <tr><th>User</th><th>Amount</th><th>Method</th><th>Account</th><th>Date</th><th>Status</th></tr>
                            </thead>
                            <tbody>
            `;
            
            if (pageItems.length === 0) {
                html += `<tr><td colspan="6" style="text-align:center; padding:40px;">No ${filter} withdrawals found</td></tr>`;
            } else {
                pageItems.forEach(w => {
                    const statusClass = w.status === 'pending' ? 'badge-pending' : (w.status === 'approved' ? 'badge-approved' : 'badge-rejected');
                    html += `
                        <tr onclick="showWithdrawDetail('${w.id}')">
                            <td><strong>${w.userName || 'N/A'}</strong><br><small>${w.userEmail || ''}</small></td>
                            <td><strong>${w.amount || 0} VEVO</strong></td>
                            <td>${w.methodName || w.method || 'N/A'}</td>
                            <td>${w.account || 'N/A'}</td>
                            <td><small>${w.createdAt ? new Date(w.createdAt).toLocaleDateString() : 'N/A'}</small></td>
                            <td><span class="badge ${statusClass}">${(w.status || 'pending').toUpperCase()}</span></td>
                        </tr>
                    `;
                });
            }
            
            html += `</tbody></table></div>`;
            
            if (totalPages > 1) {
                html += `<div class="pagination">`;
                html += `<button onclick="loadWithdraws('${filter}', ${page - 1})" ${page === 1 ? 'disabled' : ''}>←</button>`;
                for (let i = Math.max(1, page - 2); i <= Math.min(totalPages, page + 2); i++) {
                    html += `<button class="${i === page ? 'active' : ''}" onclick="loadWithdraws('${filter}', ${i})">${i}</button>`;
                }
                html += `<button onclick="loadWithdraws('${filter}', ${page + 1})" ${page === totalPages ? 'disabled' : ''}>→</button>`;
                html += `</div>`;
            }
            
            html += `</div>`;
            document.getElementById('adminContent').innerHTML = html;
        }
        
        // ============================================
        // USERS (With Add/Decrease Balance)
        // ============================================
        function loadUsers(page = 1) {
            document.getElementById('pageTitle').textContent = 'All Users';
            
            const sorted = [...cachedUsers].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            const totalBalance = sorted.reduce((s, u) => s + (u.balance || 0), 0);
            
            const totalPages = Math.ceil(sorted.length / PAGE_SIZE);
            const start = (page - 1) * PAGE_SIZE;
            const pageItems = sorted.slice(start, start + PAGE_SIZE);
            
            let html = `
                <div class="stats-grid">
                    <div class="stat-card"><i class="fas fa-users"></i><h3>Total Users</h3><div class="number">${sorted.length}</div></div>
                    <div class="stat-card"><i class="fas fa-coins"></i><h3>Total Balance</h3><div class="number">${totalBalance.toLocaleString()} VEVO</div></div>
                </div>
                
                <div class="section-card">
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" id="userSearch" placeholder="Search by email or name..." onkeyup="filterTable('userTable', this.value)">
                    </div>
                    
                    <div class="table-wrapper">
                        <table id="userTable">
                            <thead>
                                <tr><th>User</th><th>Balance</th><th>Invited</th><th>Joined</th><th>Code</th><th>Actions</th></tr>
                            </thead>
                            <tbody>
            `;
            
            pageItems.forEach(user => {
                html += `
                    <tr>
                        <td>
                            <strong>${user.name || 'N/A'}</strong><br>
                            <small>${user.email || ''}</small>
                        </td>
                        <td><strong style="color: ${user.balance > 0 ? '#48bb78' : '#333'};">${user.balance || 0} VEVO</strong></td>
                        <td>${user.inviteCount || 0} (${user.inviteRewards || 0})</td>
                        <td><small>${user.createdAt ? new Date(user.createdAt).toLocaleDateString() : 'N/A'}</small></td>
                        <td><span class="badge ${user.withdrawCode ? 'badge-approved' : 'badge-pending'}">${user.withdrawCode ? 'Set' : 'Not Set'}</span></td>
                        <td>
                            <button onclick="event.stopPropagation(); showUserDetail('${user.uid}')" style="background:#667eea; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer; margin-right:5px;">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button onclick="event.stopPropagation(); openAddBalance('${user.uid}', '${user.name || user.email}', ${user.balance || 0})" style="background:#48bb78; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer; margin-right:5px;">
                                <i class="fas fa-plus"></i>
                            </button>
                            <button onclick="event.stopPropagation(); openDecreaseBalance('${user.uid}', '${user.name || user.email}', ${user.balance || 0})" style="background:#ff4757; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">
                                <i class="fas fa-minus"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
            
            html += `</tbody></table></div>`;
            
            if (totalPages > 1) {
                html += `<div class="pagination">`;
                html += `<button onclick="loadUsers(${page - 1})" ${page === 1 ? 'disabled' : ''}>←</button>`;
                for (let i = Math.max(1, page - 2); i <= Math.min(totalPages, page + 2); i++) {
                    html += `<button class="${i === page ? 'active' : ''}" onclick="loadUsers(${i})">${i}</button>`;
                }
                html += `<button onclick="loadUsers(${page + 1})" ${page === totalPages ? 'disabled' : ''}>→</button>`;
                html += `</div>`;
            }
            
            html += `</div>`;
            document.getElementById('adminContent').innerHTML = html;
        }
        
        // ============================================
        // DETAIL MODALS
        // ============================================
        function showDepositDetail(depositId) {
            const deposit = cachedDeposits.find(d => d.id === depositId);
            if (!deposit) return;
            
            document.getElementById('modalContent').innerHTML = `
                <div class="modal-header"><h3><i class="fas fa-money-bill-wave"></i> Deposit Details</h3></div>
                <div class="detail-row"><div class="detail-label">User:</div><div class="detail-value">${deposit.userName || 'N/A'}</div></div>
                <div class="detail-row"><div class="detail-label">Email:</div><div class="detail-value">${deposit.userEmail || 'N/A'}</div></div>
                <div class="detail-row"><div class="detail-label">Amount:</div><div class="detail-value">${deposit.amount || 0} ${deposit.currency || 'BIRR'}</div></div>
                <div class="detail-row"><div class="detail-label">VEVO Value:</div><div class="detail-value"><strong>${deposit.vevoAmount || 0} VEVO</strong></div></div>
                <div class="detail-row"><div class="detail-label">Method:</div><div class="detail-value">${deposit.methodDetails || deposit.method || 'N/A'}</div></div>
                <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value"><span class="badge ${deposit.status === 'pending' ? 'badge-pending' : (deposit.status === 'approved' ? 'badge-approved' : 'badge-rejected')}">${(deposit.status || 'pending').toUpperCase()}</span></div></div>
                <div class="detail-row"><div class="detail-label">Date:</div><div class="detail-value">${deposit.createdAt ? new Date(deposit.createdAt).toLocaleString() : 'N/A'}</div></div>
                ${deposit.screenshot ? `<div class="detail-row"><div class="detail-label">Screenshot:</div><div class="detail-value"><img src="${deposit.screenshot}" class="screenshot-img" onclick="window.open(this.src)"></div></div>` : ''}
                ${deposit.status === 'pending' ? `
                    <div class="action-buttons">
                        <button class="btn-approve" onclick="approveDeposit('${deposit.id}', ${deposit.vevoAmount || 0}, '${deposit.userId}')">✅ Approve</button>
                        <button class="btn-reject" onclick="rejectDeposit('${deposit.id}')">❌ Reject</button>
                    </div>
                ` : ''}
            `;
            document.getElementById('detailModal').style.display = 'block';
        }
        
        function showWithdrawDetail(withdrawId) {
            const withdraw = cachedWithdraws.find(w => w.id === withdrawId);
            if (!withdraw) return;
            
            document.getElementById('modalContent').innerHTML = `
                <div class="modal-header"><h3><i class="fas fa-hand-holding-usd"></i> Withdrawal Details</h3></div>
                <div class="detail-row"><div class="detail-label">User:</div><div class="detail-value">${withdraw.userName || 'N/A'}</div></div>
                <div class="detail-row"><div class="detail-label">Email:</div><div class="detail-value">${withdraw.userEmail || 'N/A'}</div></div>
                <div class="detail-row"><div class="detail-label">Amount:</div><div class="detail-value"><strong>${withdraw.amount || 0} VEVO</strong></div></div>
                <div class="detail-row"><div class="detail-label">Method:</div><div class="detail-value">${withdraw.methodName || withdraw.method || 'N/A'}</div></div>
                <div class="detail-row"><div class="detail-label">Account:</div><div class="detail-value">${withdraw.account || 'N/A'}</div></div>
                <div class="detail-row"><div class="detail-label">Status:</div><div class="detail-value"><span class="badge ${withdraw.status === 'pending' ? 'badge-pending' : (withdraw.status === 'approved' ? 'badge-approved' : 'badge-rejected')}">${(withdraw.status || 'pending').toUpperCase()}</span></div></div>
                <div class="detail-row"><div class="detail-label">Date:</div><div class="detail-value">${withdraw.createdAt ? new Date(withdraw.createdAt).toLocaleString() : 'N/A'}</div></div>
                ${withdraw.status === 'pending' ? `
                    <div class="action-buttons">
                        <button class="btn-approve" onclick="approveWithdraw('${withdraw.id}', ${withdraw.amount || 0}, '${withdraw.userId}')">✅ Approve</button>
                        <button class="btn-reject" onclick="rejectWithdraw('${withdraw.id}')">❌ Reject</button>
                    </div>
                ` : ''}
            `;
            document.getElementById('detailModal').style.display = 'block';
        }
        
        function showUserDetail(userId) {
            const user = cachedUsers.find(u => u.uid === userId);
            if (!user) return;
            
            document.getElementById('modalContent').innerHTML = `
                <div class="modal-header"><h3><i class="fas fa-user"></i> User Details</h3></div>
                <div class="detail-row"><div class="detail-label">Name:</div><div class="detail-value">${user.name || 'N/A'}</div></div>
                <div class="detail-row"><div class="detail-label">Email:</div><div class="detail-value">${user.email || 'N/A'}</div></div>
                <div class="detail-row"><div class="detail-label">Balance:</div><div class="detail-value"><strong>${user.balance || 0} VEVO</strong></div></div>
                <div class="detail-row"><div class="detail-label">Withdraw Code:</div><div class="detail-value">${user.withdrawCode || 'Not Set'}</div></div>
                <div class="detail-row"><div class="detail-label">Invited:</div><div class="detail-value">${user.inviteCount || 0} friends</div></div>
                <div class="detail-row"><div class="detail-label">Rewards:</div><div class="detail-value">${user.inviteRewards || 0} VEVO</div></div>
                <div class="detail-row"><div class="detail-label">Joined:</div><div class="detail-value">${user.createdAt ? new Date(user.createdAt).toLocaleString() : 'N/A'}</div></div>
                <div class="action-buttons">
                    <button class="btn-warning" onclick="resetUserCode('${user.uid}')">🔑 Reset Code</button>
                    <button class="btn-approve" onclick="closeDetailModal(); openAddBalance('${user.uid}', '${user.name || user.email}', ${user.balance || 0})">💰 Add Balance</button>
                    <button class="btn-reject" onclick="closeDetailModal(); openDecreaseBalance('${user.uid}', '${user.name || user.email}', ${user.balance || 0})">📉 Decrease</button>
                </div>
            `;
            document.getElementById('detailModal').style.display = 'block';
        }
        
        // ============================================
        // BALANCE MANAGEMENT
        // ============================================
        function openAddBalance(userId, userName, currentBalance) {
            document.getElementById('modalContent').innerHTML = `
                <div class="modal-header"><h3><i class="fas fa-plus-circle"></i> Add Balance</h3></div>
                <div class="detail-row"><div class="detail-label">User:</div><div class="detail-value">${userName}</div></div>
                <div class="detail-row"><div class="detail-label">Current:</div><div class="detail-value">${currentBalance} VEVO</div></div>
                <div class="detail-row"><div class="detail-label">Amount to Add:</div><div class="detail-value"><input type="number" id="balanceAmount" style="padding:8px; width:100%; border:1px solid #ddd; border-radius:5px;" placeholder="Enter amount" min="1"></div></div>
                <div class="action-buttons">
                    <button class="btn-approve" onclick="confirmAddBalance('${userId}', ${currentBalance})">✅ Add</button>
                    <button class="btn-reject" onclick="closeDetailModal()">❌ Cancel</button>
                </div>
            `;
            document.getElementById('detailModal').style.display = 'block';
        }
        
        function openDecreaseBalance(userId, userName, currentBalance) {
            document.getElementById('modalContent').innerHTML = `
                <div class="modal-header"><h3><i class="fas fa-minus-circle"></i> Decrease Balance</h3></div>
                <div class="detail-row"><div class="detail-label">User:</div><div class="detail-value">${userName}</div></div>
                <div class="detail-row"><div class="detail-label">Current:</div><div class="detail-value">${currentBalance} VEVO</div></div>
                <div class="detail-row"><div class="detail-label">Amount to Deduct:</div><div class="detail-value"><input type="number" id="balanceAmount" style="padding:8px; width:100%; border:1px solid #ddd; border-radius:5px;" placeholder="Enter amount" min="1" max="${currentBalance}"></div></div>
                <div class="action-buttons">
                    <button class="btn-reject" onclick="confirmDecreaseBalance('${userId}', ${currentBalance})">📉 Deduct</button>
                    <button class="btn-approve" onclick="closeDetailModal()">❌ Cancel</button>
                </div>
            `;
            document.getElementById('detailModal').style.display = 'block';
        }
        
        async function confirmAddBalance(userId, currentBalance) {
            const amount = parseInt(document.getElementById('balanceAmount').value);
            if (!amount || amount <= 0) { showNotification('Enter valid amount', 'error'); return; }
            
            await db.ref(`users/${userId}`).update({ balance: currentBalance + amount });
            
            // Update cache
            const userIndex = cachedUsers.findIndex(u => u.uid === userId);
            if (userIndex !== -1) cachedUsers[userIndex].balance = currentBalance + amount;
            
            showNotification(`Added ${amount} VEVO!`, 'success');
            closeDetailModal();
            loadUsers();
        }
        
        async function confirmDecreaseBalance(userId, currentBalance) {
            const amount = parseInt(document.getElementById('balanceAmount').value);
            if (!amount || amount <= 0) { showNotification('Enter valid amount', 'error'); return; }
            if (amount > currentBalance) { showNotification('Amount exceeds balance', 'error'); return; }
            
            await db.ref(`users/${userId}`).update({ balance: currentBalance - amount });
            
            // Update cache
            const userIndex = cachedUsers.findIndex(u => u.uid === userId);
            if (userIndex !== -1) cachedUsers[userIndex].balance = currentBalance - amount;
            
            showNotification(`Deducted ${amount} VEVO!`, 'success');
            closeDetailModal();
            loadUsers();
        }
        
        // ============================================
        // ACTIONS
        // ============================================
        async function approveDeposit(id, vevoAmount, userId) {
            if (!confirm(`Approve deposit? User receives ${vevoAmount} VEVO.`)) return;
            
            await db.ref(`deposits/${id}`).update({ status: 'approved', approvedAt: Date.now() });
            if (userId) {
                const userRef = db.ref(`users/${userId}`);
                const snap = await userRef.once('value');
                const user = snap.val();
                await userRef.update({ balance: (user.balance || 0) + vevoAmount });
            }
            showNotification('Deposit approved!', 'success');
            closeDetailModal();
            loadInitialData();
        }
        
        async function rejectDeposit(id) {
            if (!confirm('Reject this deposit?')) return;
            await db.ref(`deposits/${id}`).update({ status: 'rejected', rejectedAt: Date.now() });
            showNotification('Deposit rejected', 'success');
            closeDetailModal();
            loadInitialData();
        }
        
        async function approveWithdraw(id, amount, userId) {
            if (!confirm(`Approve withdrawal? ${amount} VEVO deducted.`)) return;
            
            await db.ref(`withdraws/${id}`).update({ status: 'approved', approvedAt: Date.now() });
            if (userId) {
                const userRef = db.ref(`users/${userId}`);
                const snap = await userRef.once('value');
                const user = snap.val();
                await userRef.update({ balance: Math.max(0, (user.balance || 0) - amount) });
            }
            showNotification('Withdrawal approved!', 'success');
            closeDetailModal();
            loadInitialData();
        }
        
        async function rejectWithdraw(id) {
            if (!confirm('Reject this withdrawal?')) return;
            await db.ref(`withdraws/${id}`).update({ status: 'rejected', rejectedAt: Date.now() });
            showNotification('Withdrawal rejected', 'success');
            closeDetailModal();
            loadInitialData();
        }
        
        async function resetUserCode(userId) {
            if (!confirm('Reset withdrawal code?')) return;
            await db.ref(`users/${userId}`).update({ withdrawCode: null });
            showNotification('Code reset!', 'success');
            closeDetailModal();
            loadInitialData();
        }
        
        function closeDetailModal() { document.getElementById('detailModal').style.display = 'none'; }
        
        function filterTable(tableId, searchText) {
            const rows = document.querySelectorAll(`#${tableId} tbody tr`);
            const search = searchText.toLowerCase();
            rows.forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(search) ? '' : 'none';
            });
        }
        
        function loadSettings() {
            document.getElementById('pageTitle').textContent = 'Settings';
            document.getElementById('adminContent').innerHTML = `
                <div class="section-card">
                    <h3 class="section-title"><i class="fas fa-cog"></i> System Settings</h3>
                    <p><strong>Exchange Rate:</strong> 1 Birr = 1 VEVO | 1 USDT = 157 VEVO</p>
                    <p><strong>Referral:</strong> 10 VEVO per 5 invites</p>
                    <hr style="margin:20px 0;">
                    <h3>Payment Accounts</h3>
                    <p><strong>M-Pesa:</strong> 0725032395 (Abenezer Shigute)</p>
                    <p><strong>TeleBirr:</strong> 0940980555 (Tenaye Hutalo)</p>
                    <p><strong>CBE Birr:</strong> 0940980555</p>
                    <p><strong>CBE Bank:</strong> 1000612391754</p>
                    <p><strong>TRC20:</strong> TWym3qg8TUNTyutMxvPpnatjeWs8C7jsLY</p>
                </div>
            `;
        }
        
        // Navigation
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                const tab = item.dataset.tab;
                if (tab === 'dashboard') loadDashboard();
                else if (tab === 'deposits') loadDeposits('pending');
                else if (tab === 'withdraws') loadWithdraws('pending');
                else if (tab === 'users') loadUsers();
                else if (tab === 'settings') loadSettings();
            });
        });
        
        window.onclick = (e) => { if (e.target.classList.contains('modal')) closeDetailModal(); };
        
        // Global exports
        window.toggleSidebar = toggleSidebar;
        window.adminLogin = adminLogin;
        window.adminLogout = adminLogout;
        window.loadInitialData = loadInitialData;
        window.loadDashboard = loadDashboard;
        window.loadDeposits = loadDeposits;
        window.loadWithdraws = loadWithdraws;
        window.loadUsers = loadUsers;
        window.loadSettings = loadSettings;
        window.showDepositDetail = showDepositDetail;
        window.showWithdrawDetail = showWithdrawDetail;
        window.showUserDetail = showUserDetail;
        window.approveDeposit = approveDeposit;
        window.rejectDeposit = rejectDeposit;
        window.approveWithdraw = approveWithdraw;
        window.rejectWithdraw = rejectWithdraw;
        window.resetUserCode = resetUserCode;
        window.openAddBalance = openAddBalance;
        window.openDecreaseBalance = openDecreaseBalance;
        window.confirmAddBalance = confirmAddBalance;
        window.confirmDecreaseBalance = confirmDecreaseBalance;
        window.closeDetailModal = closeDetailModal;
        window.filterTable = filterTable;
    </script>
</body>
</html>
